
name: Build VEDA Browser APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unzip project
        run: |
          mkdir -p /tmp/veda-project
          unzip -o VEDA-Browser-adblock.zip -d /tmp/veda-project
          cp -R /tmp/veda-project/. .

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEDA-Browser-debug
          path: app/build/outputs/apk/debug/app-debug.apk
